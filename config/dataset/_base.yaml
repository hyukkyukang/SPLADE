# @package dataset
name: base
type: custom

split: train
corpus_split: ${.split}
hf_split: ${.split}

# MSMARCO max query token number is 87, 128 is a good compromise
max_query_length: 128
max_doc_length: 256
max_padding: true
query_long_doc_strategy: truncate
query_sliding_window_overlap_tokens: 0
num_negatives: 1
num_positives: 1

negative_sampling:
  strategy: random
  top_k: null
  random_k: null
  random_pool: null

beir_dataset: null

hf_name: null
hf_subset: null
hf_cache_dir: null
hf_max_samples: null
hf_skip_samples: 0
hf_data_files: null
query_corpus_hf_name: null
query_corpus_hf_cache_dir: null
query_corpus_hf_data_files: null
query_hf_data_files: null
corpus_hf_data_files: null
query_lookup_hf_name: null
query_lookup_hf_subset: null
query_lookup_hf_split: train
query_lookup_hf_cache_dir: null
query_lookup_hf_data_files: null
query_lookup_id_column: query_id
query_lookup_text_column: text
max_queries: null
qrels_hf_name: null
qrels_hf_subset: null
qrels_hf_split: null
qrels_hf_cache_dir: null
qrels_hf_data_files: null
use_qrels: true
use_triplet_positives: false
filter_queries_with_positives: false
triplet_positive_cache_path: null
triplet_positive_cache_overwrite: false
load_corpus_in_memory: false
local_triplets_dir: null

# Column names for query/corpus datasets.
query_subset_name: queries
query_split_name: ${.split}
query_id_column: _id
query_text_column: text
corpus_subset_name: corpus
corpus_split_name: ${.corpus_split}
corpus_id_column: _id
corpus_text_column: text
corpus_title_column: null
corpus_additional_text_columns: []

# Optional: join scored hard negatives by query id.
score_hf_name: null
score_hf_subset: null
score_hf_split: ${.split}
score_hf_cache_dir: null
score_hf_data_files: null
score_query_id_column: query_id
score_doc_ids_column: doc_ids
score_labels_column: labels
score_scores_column: scores
score_negatives_per_query: 1
score_missing_policy: error
score_duplicate_policy: error
score_log_every: 0
score_progress_bar: false
score_progress_refresh: 0.5
