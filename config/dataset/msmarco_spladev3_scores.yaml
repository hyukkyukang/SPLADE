# @package dataset
defaults:
  - _base@_here_

name: msmarco_spladev3_scores
type: msmarco_distill_scores
split: train

# Scored metadata rows (query_id/doc_ids/labels/scores).
# Uses locally finalized SPLADE-v3 distillation scores parquet.
hf_name: parquet
hf_subset: null
hf_cache_dir: null
hf_max_samples: null
hf_skip_samples: 0
hf_data_files:
  train: data/hard_negatives/msmarco_spladev3_ensemble_scores.parquet

query_corpus_hf_name: sentence-transformers/msmarco
query_corpus_hf_cache_dir: null
query_corpus_hf_data_files: null

# Column names for query/corpus datasets.
query_id_column: query_id
query_text_column: query
corpus_id_column: passage_id
corpus_text_column: passage

num_negatives: 8
num_positives: 1

negative_sampling:
  strategy: topk
  top_k: null
  random_k: null
  random_pool: null
