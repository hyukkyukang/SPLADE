# Finalize SPLADE-v3 distillation dataset (min-max + rescore + trim)
seed: 10
log_dir_base: "log"
tag: null
log_dir: ${tagged_log_dir:${log_dir_base},${tag}}
root_dir_path: "."

defaults:
  - _self_
  - override hydra/job_logging: colorlog_custom

input_defaults: &input_defaults
  path: null
  format: auto
  score_key: scores
  query_id_key: query_id
  doc_ids_key: doc_ids
  labels_key: labels
  hf_name: null
  hf_subset: null
  hf_split: train
  hf_cache_dir: null
  hf_data_files: null

inputs:
  - <<: *input_defaults
    path: data/hard_negatives/scores/msmarco_hardneg_100_minilm_l6_v2_scores.jsonl
  - <<: *input_defaults
    path: data/hard_negatives/scores/msmarco_hardneg_100_rankt53b_repro_scores.jsonl
  - <<: *input_defaults
    path: data/hard_negatives/scores/msmarco_hardneg_100_debertav3_scores.jsonl
  - <<: *input_defaults
    path: data/hard_negatives/scores/msmarco_hardneg_100_debertav2_scores.jsonl
  - <<: *input_defaults
    path: data/hard_negatives/scores/msmarco_hardneg_100_electra_scores.jsonl

merge:
  output_path: data/hard_negatives/msmarco_spladev3_ensemble_scores.jsonl
  output_score_key: scores
  query_id_key: query_id
  doc_ids_key: doc_ids
  labels_key: labels
  overwrite: true
  strict_alignment: true
  flush_every: 1000
  max_rows: null

normalization:
  enabled: true
  epsilon: 1e-6

rescore:
  enabled: true
  output_mean: null
  output_std: null
  reference:
    hf_name: Hyukkyu/msmarco-spladev2-hard-negatives-scores
    hf_subset: null
    hf_split: train
    hf_cache_dir: null
    hf_data_files: null
    path: null
    format: auto
    score_key: scores
    query_id_key: query_id
    doc_ids_key: doc_ids
    labels_key: labels

trim:
  negatives: 8
  require_positive: true

postprocess:
  enabled: true
  parquet_path: null
  cleanup_jsonl: true
  require_count_match: true

upload_to_hub: true
hf_repo_id: Hyukkyu/msmarco-spladev3-scores
hf_token: null
