# Search entrypoint config
seed: 10
log_dir_base: "log"
tag: null
log_dir: ${tagged_log_dir:${log_dir_base},${tag}}
root_dir_path: "."

# Defaults
defaults:
  - model: splade_v1
  - encoding: default
  - dataset: msmarco
  - testing: default
  - _self_
  # The following overrides are necessary to make the logging colorized.
  - override hydra/job_logging: colorlog_custom

dataset:
  max_padding: ${testing.max_padding}
  use_qrels: false
  use_triplet_positives: true
  triplet_positive_cache_path: data/cache/msmarco_triplet_positives.parquet

mining:
  output_dir_base: "data/hard_negatives"
  run_filename: "hard_negatives.jsonl"
  # Optional post-processing: convert per-rank JSONL outputs to Parquet shards.
  postprocess:
    enabled: true
    # Parquet shards are written next to the JSONL files.
    # Delete JSONL files after successful conversion.
    cleanup_jsonl: true
    # Require row count match before cleanup.
    require_count_match: true
    # Add a "rank" column in the Parquet shards.
    add_rank_column: false
    # Validation: run with a small max_queries and verify row counts match
    # before enabling cleanup_jsonl.

testing:
  k_list: [500]
  save_run: true
  run_path: null

search:
  exclude_positives: true
  include_query_text: false
  merge_ranks: true
  flush_every: 100

hydra:
  output_subdir: null
  run:
    dir: ${log_dir}
  job_logging:
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        filename: ${log_dir}/search.log
