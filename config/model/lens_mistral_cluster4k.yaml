# @package model
defaults:
  - _base

name: lens_mistral_cluster4k
family: lens
# Expected artifact dir from the LENS model-creation pipeline.
huggingface_name: outputs/model_creation/lens/mistral_cluster4k
huggingface_model_class: MistralBiForCausalLM
trust_remote_code: false
use_fast_tokenizer: true
require_fast_tokenizer: true
# Force the strict-LENS tokenizer path at training time so the Phase 1
# retrain uses the SAME tokenizer (base mistralai/Mistral-7B-v0.1 + 3 LENS
# specials, no auto-EOS) that the official Yibin-Lei/LENS training used.
# Without this, build_model_tokenizer would load the cluster4k artifact's
# tokenizer.json (auto-EOS=True), producing a 1-token offset vs the
# inference-time tokenizer in src.utils.lens_official_loader.
strict_official_lens_tokenizer: true

dtype: bfloat16
attn_implementation: sdpa
tie_word_embeddings: false
freeze_backbone: false
bidirectional: true

query_pooling: max
doc_pooling: max
sparse_activation: log1p_relu
# Paper LENS uses --normlized True during training; embeddings are L2-normalized
# before the contrastive dot product (so the temperature 0.02 yields sane scores).
normalize: true
benchmark_adapter: native
instruction_text: "Represent this query for retrieving relevant documents."
doc_trim_last_tokens: 2

peft:
  enabled: true
  method: lora
  task_type: auto
  r: 32
  alpha: 64
  dropout: 0.1
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - down_proj
    - up_proj
  modules_to_save: null
  fan_in_fan_out: false
  inference_mode: false
