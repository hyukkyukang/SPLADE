model_dir: outputs/embeddinggemma_lsr/model_init
output_dir: outputs/embeddinggemma_lsr/train_run

meta_hf_name: sentence-transformers/msmarco
meta_hf_subset: triplets
train_split: train
val_split: validation
allow_missing_val_split: true
hf_cache_dir: null

meta_query_id_column: query_id
meta_positive_id_column: positive_id
meta_query_text_column: query
meta_positive_text_column: positive

query_subset: queries
query_split: train
query_id_column: query_id
query_text_column: query

corpus_subset: corpus
corpus_split: train
corpus_id_column: passage_id
corpus_text_column: passage

max_train_pairs: 500000
max_val_pairs: 4096

max_steps: 150000
batch_size: 32
num_workers: 8
optimizer: adam
lr: 2.0e-5
weight_decay: 0.0
warmup_steps: 6000
max_grad_norm: 1.0

temperature: 1.0
lambda_flops_q: 0.0002
lambda_flops_d: 0.0001

max_query_length: 128
max_doc_length: 256

eval_every: 5000
eval_batch_size: 8
eval_max_queries: 2000
eval_max_docs: 20000

seed: 42
device: auto
num_gpus: 4
dtype: bfloat16
trust_remote_code: false
local_files_only: false
