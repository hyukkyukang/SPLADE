# Cross-encoder scoring entrypoint config
seed: 10
log_dir_base: "log"
tag: null
log_dir: ${tagged_log_dir:${log_dir_base},${tag}}
root_dir_path: "."

defaults:
  - _self_
  - dataset@score_dataset: msmarco
  - scoring: cross_encoder
  - mining: score_cross_encoder
  - override hydra/job_logging: colorlog_custom

hard_negatives:
  # Empty means merge all available keys in the neg dict.
  neg_keys: []
  max_negatives: null
  max_positives: null
  require_negatives: true

score_dataset:
  hf_name: null
  hf_subset: null
  hf_split: train
  hf_cache_dir: null
  hf_data_files: null
  query_corpus_hf_name: sentence-transformers/msmarco
  query_corpus_hf_cache_dir: null
  query_corpus_hf_data_files: null

positives:
  enabled: false
  cache_path: data/cache/msmarco_triplet_positives.parquet
  hf_name: sentence-transformers/msmarco
  hf_subset: triplets
  hf_split: train
  hf_cache_dir: null
  hf_data_files: null
