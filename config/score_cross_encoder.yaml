# Cross-encoder scoring entrypoint config
seed: 10
log_dir_base: "log"
tag: null
log_dir: ${tagged_log_dir:${log_dir_base},${tag}}
root_dir_path: "."

defaults:
  - _self_
  - dataset@score_dataset: msmarco
  - override hydra/job_logging: colorlog_custom

scoring:
  model_name: cross-encoder/ms-marco-MiniLM-L-12-v2
  output_dir: "data/hard_negatives"
  output_basename: "msmarco_cross_encoder_scores"
  output_format: jsonl
  batch_size: 16
  max_length: 512
  use_cpu: false
  max_rows: null
  overwrite: true
  score_key: scores

score_dataset:
  hf_name: json
  hf_subset: null
  hf_split: train
  hf_cache_dir: null
  hf_data_files: log/search_results.jsonl
  query_corpus_hf_name: sentence-transformers/msmarco
  query_corpus_hf_cache_dir: null
  query_corpus_hf_data_files: null

positives:
  enabled: true
  cache_path: data/cache/msmarco_triplet_positives.parquet
  hf_name: sentence-transformers/msmarco
  hf_subset: triplets
  hf_split: train
  hf_cache_dir: null
  hf_data_files: null
