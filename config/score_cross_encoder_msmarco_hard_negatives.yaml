# Cross-encoder scoring entrypoint for MS MARCO hard negatives (sentence-transformers)
defaults:
  - score_cross_encoder
  - _self_
  - override /mining: disabled

scoring:
  data_module: hard_negatives
  output_dir: "data/hard_negatives/scores"
  output_basename: "msmarco_hard_negatives_cross_encoder_scores"
  hf_hub_etag_timeout: 300
  hf_hub_download_timeout: 300

score_dataset:
  hf_name: sentence-transformers/msmarco-hard-negatives
  hf_subset: null
  hf_split: train
  hf_cache_dir: null
  hf_data_files: msmarco-hard-negatives.jsonl.gz
  query_corpus_hf_name: sentence-transformers/msmarco
  query_corpus_hf_cache_dir: null
  query_corpus_hf_data_files: null

hard_negatives:
  neg_keys: []
