# @package testing
name: default

batch_size: 32
num_workers: 2
max_padding: true

precision: bf16-mixed
use_cpu: false
torch_compile: true
# Options: default, reduce-overhead, and max-autotune.
torch_compile_mode: default
max_windows_per_forward: null
strategy: ddp
static_graph: true
num_devices: null
gpu_sparsify: true
scoring_workers: 4
scoring_method: full
scoring_backend: threads
wand_block_size: 256
exclude_self_match: false
sparse_top_k: 512
sparse_min_weight: 0.0
query_exclude_token_ids: ${model.exclude_token_ids}

k_list: [1, 5, 10, 50, 100]
save_run: false
run_path: null
# Optional: set to a Hugging Face model repo ID or local path to use HF weights.
hf_model_path: null
checkpoint_path: null
use_checkpoint_config: true
