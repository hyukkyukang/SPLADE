# Training entrypoint config for EmbeddingGemma-created SPLADE backbone
seed: 10
log_dir_base: "log/train/${model.name}"
tag: null
log_dir: ${tagged_log_dir:${log_dir_base},${tag}}
root_dir_path: "."

# Defaults
defaults:
  - model: splade_v2_pp_embeddinggemma_300m_lsr
  - dataset@train_dataset: msmarco
  - dataset@val_dataset: msmarco_dev_small_negatives
  - training: splade_v2_pp_embeddinggemma_300m
  - testing: default
  - override hydra/job_logging: colorlog_custom
  - _self_

train_dataset:
  hf_skip_samples: ${training.val_sample_size}
  hf_max_samples: null
  max_padding: ${training.max_padding}
  pretokenize:
    output_dir: data/cache/pretokenized/msmarco_embeddinggemma_splade_lsr
    overwrite: false
    storage_format: sidecar_only
    loading_mode: streaming
    streaming_max_cached_shards: 8
    streaming_row_cache_size: 50000
    streaming_index_cache_size: 100000
    streaming_sqlite_cache_size_kib: 65536
    streaming_sqlite_mmap_size: 2147483648
    streaming_numpy_sidecar: true

val_dataset:
  hf_max_samples: ${training.val_sample_size}
  hf_skip_samples: 0
  max_padding: ${training.max_padding}
  query_lookup_hf_name: Hyukkyu/beir-msmarco
  query_lookup_hf_subset: queries
  query_lookup_hf_split: train
  query_lookup_hf_cache_dir: null
  query_lookup_hf_data_files: null
  query_lookup_id_column: _id
  query_lookup_text_column: text
  pretokenize:
    enabled: true
    output_dir: data/cache/pretokenized/msmarco_dev_small_negatives_embeddinggemma_splade_lsr
    overwrite: false
    storage_format: sidecar_only
    loading_mode: streaming
    streaming_max_cached_shards: 8
    streaming_numpy_sidecar: true

nanobeir:
  enabled: true
  run_every_n_val: 1
  datasets: [msmarco, nfcorpus, nq]
  batch_size: ${training.eval_batch_size}
  max_seq_length: ${train_dataset.max_doc_length}
  use_cpu: false
  cache_dir: null
  save_json: true

hydra:
  output_subdir: null
  run:
    dir: ${log_dir}
  job_logging:
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        filename: ${log_dir}/train.log
