# Training entrypoint config for stage-1 patent in-batch finetuning with SPLADE-v3
seed: 10
log_dir_base: "log/train/${model.name}"
tag: null
log_dir: ${tagged_log_dir:${log_dir_base},${tag}}
root_dir_path: "."
required_train_dataset_name: patent_us_in_batch

defaults:
  - model: splade_v3_naver
  - dataset@train_dataset: patent_us_in_batch
  - dataset@val_dataset: patent_us_in_batch
  - training: splade_v3_patent_in_batch
  - testing: default
  - override hydra/job_logging: colorlog_custom
  - _self_

train_dataset:
  hf_skip_samples: ${training.val_sample_size}
  hf_max_samples: null
  max_padding: ${training.max_padding}

val_dataset:
  hf_max_samples: ${training.val_sample_size}
  hf_skip_samples: 0
  max_padding: ${training.max_padding}

nanobeir:
  enabled: false
  run_every_n_val: 1
  datasets: []
  batch_size: ${training.eval_batch_size}
  max_seq_length: ${train_dataset.max_doc_length}
  use_cpu: ${training.use_cpu}
  cache_dir: null
  save_json: false

hydra:
  output_subdir: null
  run:
    dir: ${log_dir}
  job_logging:
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        filename: ${log_dir}/train.log
