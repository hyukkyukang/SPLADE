# @package training
defaults:
  # Select optimizer via
  # `optimizer@training=adam|adamw`
  # to keep weight_decay in sync.
  - /optimizer@_global_.training: adam

name: splade

max_steps: 150000
batch_size: 32
eval_batch_size: 16
# Validation keeps 100 candidates/query for metrics, but encodes doc candidates
# in micro-batches to cap peak VRAM.
validation_doc_encode_chunk_size: 20
grad_accumulation: 1
num_workers: 4
prefetch_factor: 2
dataloader_multiprocessing_context: null
max_padding: true
# Initialize model weights only (does not restore optimizer/scheduler/step).
init_checkpoint_path: null
# Resume full Lightning trainer state from checkpoint.
resume_checkpoint_path: null

lr: 2e-5
warmup_steps: 6000
scheduler: linear
max_grad_norm: 1.0

precision: bf16-mixed
use_cpu: false
torch_compile: true
torch_compile_loss: true
# Options: default, reduce-overhead, and max-autotune.
torch_compile_mode: max-autotune
# Validation can use a different compile mode than training.
torch_compile_validation_mode: default
# For very large vocab MLM heads (e.g., ANNAvocab), Triton GEMM autotune can
# hit illegal-address errors; force ATen GEMM backends in that regime.
torch_compile_force_aten_gemm_for_large_vocab: true
torch_compile_large_vocab_threshold: 100000
# Optional per-wrapper fallback compile modes for large-vocab runs.
# `null` keeps the global mode.
torch_compile_large_vocab_query_fallback_mode: max-autotune
torch_compile_large_vocab_doc_fallback_mode: max-autotune
# Loss compile can also use a fallback mode under large-vocab safety.
torch_compile_large_vocab_loss_fallback_mode: max-autotune
torch_compile_skip_query_encoder_for_large_vocab: false
torch_compile_skip_doc_encoder_for_large_vocab: false
# Enable safer DDP settings for compile-heavy modes by default.
torch_compile_ddp_safe_mode: true
# Keep torch.compile enabled during validation by default.
disable_compile_for_validation: false
strategy: ddp
static_graph: true
find_unused_parameters: false
num_devices: null
sparse_top_k: 0
sparse_min_weight: 0.0

val_check_interval: 5000
limit_val_batches: 1.0
log_every_n_steps: 200
# Gate expensive step-only metrics (active dims/sparsity/flops proxy) to reduce
# per-step logging overhead. `1` keeps previous behavior (log every step).
step_only_metric_log_interval: 1
val_sample_size: 4096

progress_bar:
  enabled: true
  # We set low refresh rate hoping that we can make the training faster.
  # Updates per second:
  #   - 0.1 means 1 update every 10 seconds.
  #   - 0.2 means 1 update every 5 seconds. 
  #   - 1.0 means 1 update every 1 second. 
  refresh_rate: 0.1

validation_metrics:
  enabled: true
  # `custom` uses deterministic tie-aware metric computation for validation.
  # `torchmetrics` keeps previous behavior.
  backend: custom
  # Seed for deterministic tie-break keys used only when backend=custom.
  tie_break_seed: 0
  k_list: [1, 5, 10, 50, 100]

temperature: 1.0

loss:
  type: in_batch
  multi_positive: true

distill:
  enabled: false
  # When true, keep the retrieval objective active while distilling.
  include_main_loss: false
  weight: 1.0
  loss: mse
  losses:
    - type: ${...loss}
      weight: ${...weight}
  teacher_score_key: teacher_scores
  fail_on_missing: true

regularization:
  query_weight: 0.0002
  doc_weight: 0.0001
  type: l1
  paper_faithful: true
  weight: null
  schedule_steps: 0

beir_eval:
  enabled: false
  datasets: []
  sample_size: 128
  max_docs: 50000
  split: test
  hf_cache_dir: null

mlflow:
  enabled: true
  experiment_name: ${oc.env:MLFLOW_EXPERIMENT_NAME,splade}
  tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,null}
  run_name: ${oc.env:MLFLOW_RUN_NAME,null}
  artifact_location: ${oc.env:MLFLOW_ARTIFACT_LOCATION,null}
  insecure_tls: ${oc.decode:${oc.env:MLFLOW_TRACKING_INSECURE_TLS,true}}
  server_cert_path: ${oc.env:MLFLOW_TRACKING_SERVER_CERT_PATH,null}
  client_cert_path: ${oc.env:MLFLOW_TRACKING_CLIENT_CERT_PATH,null}
  system_metrics_enabled: ${oc.decode:${oc.env:MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING,true}}
  # Sample system metrics every 30s (MLflow default is 10s) to reduce overhead.
  system_metrics_sampling_interval: ${oc.decode:${oc.env:MLFLOW_SYSTEM_METRICS_SAMPLING_INTERVAL,30}}
  # Log each collected sample as one metric point.
  system_metrics_samples_before_logging: ${oc.decode:${oc.env:MLFLOW_SYSTEM_METRICS_SAMPLES_BEFORE_LOGGING,1}}
  tags: {}
  log_model: false
  save_dir: ${log_dir}
  prefix: ""
