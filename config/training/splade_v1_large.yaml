# @package training
defaults:
  - _base

name: splade_v1_large

loss:
  type: in_batch

batch_size: 16
grad_accumulation: 2
# Turn off to avoid PyTorch DDP runtime bug 
static_graph: false
temperature: 10.0

regularization:
  query_weight: 0.0002
  doc_weight: 0.0001
  type: flops
  paper_faithful: true
  schedule_steps: 50000
