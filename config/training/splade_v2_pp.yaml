# @package training
defaults:
  - _base

name: splade_v2_pp

torch_compile: true
torch_compile_loss: true
# BERT-based SPLADE uses a 30,522-term vocabulary projection. In max-autotune
# mode, Triton GEMM autotuning on this head can trigger illegal-address failures
# on some GPUs, so route these large projections through the existing ATEN
# safety path.
torch_compile_large_vocab_threshold: 30000
batch_size: 32
eval_batch_size: 8
grad_accumulation: 1
static_graph: true
find_unused_parameters: false

regularization:
  query_weight: 0.0002
  doc_weight: 0.0001
  type: flops
  paper_faithful: true
  schedule_steps: 50000
