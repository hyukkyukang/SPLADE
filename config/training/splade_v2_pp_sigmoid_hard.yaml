# @package training
defaults:
  - splade_v2_pp

name: splade_v2_pp_sigmoid_hard

# The hard-negative training set is smaller than the base SPLADE runs, so the
# base integer interval (5000 batches) can exceed the per-epoch batch count and
# fail Lightning setup. Validate once per epoch by default for this config.
val_check_interval: 1.0
val_check_interval_optimizer_steps: null

loss:
  type: sigmoid_pairwise_hard
  sigmoid:
    # SPLADE dot products are much larger than dense CLIP-style similarities,
    # so start with a very small scale to avoid immediate sigmoid saturation.
    init_logit_scale: -6.907755279
    max_logit_scale: 100.0
    init_bias: -8.0
    max_bias: -5.0
    pos_weight: 1.0
    neg_weight: 1.0
