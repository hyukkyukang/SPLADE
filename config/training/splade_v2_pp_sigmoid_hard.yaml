# @package training
defaults:
  - splade_v2_pp

name: splade_v2_pp_sigmoid_hard

loss:
  type: sigmoid_pairwise_hard
  sigmoid:
    # SPLADE dot products are much larger than dense CLIP-style similarities,
    # so start with a very small scale to avoid immediate sigmoid saturation.
    init_logit_scale: -6.907755279
    max_logit_scale: 100.0
    init_bias: -8.0
    max_bias: -5.0
    pos_weight: 1.0
    neg_weight: 1.0
